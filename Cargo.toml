[package]
name = "hocg-deck-convert"
version = "1.5.0"
authors = ["Qrimpuff <qrimpuff@gmail.com>"]
publish = false
license = "MIT"
edition = "2024"

[dependencies]
hocg-fan-sim-assets-model = { git = "https://github.com/Qrimpuff/hocg-fan-sim-assets" }
hocg-fan-sim-prices-model = { git = "https://github.com/Qrimpuff/hocg-fan-sim-prices" }

base64 = "0.23.1"
bitflags = "2.13.2"
dioxus = { version = "0.7.10", features = ["web", "router"] }
dioxus-sdk-time = "0.7.0"
futures = "0.3.34"
gloo = "0.12.0"
icu_timezone = { version = "1.5.0", features = ["compiled_data"] }
image = { version = "0.25.10", features = ["png", "webp"] }
imageproc = "0.27.0"
indexmap = { version = "2.14.2", features = ["serde"] }
itertools = "0.15.0"
js-sys = "0.3.106"
jiff = { version = "0.2.37", features = ["js", "serde"] }
printpdf = { version = "0.12.8", default-features = false, features = ["png"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = [
    "json",
    "gzip",
    "brotli",
    "deflate",
] }
rexie = "0.6.2"
serde = "1.0.229"
serde_json = "1.0.151"
serde-wasm-bindgen = "0.6.5"
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["js", "v4", "v7"] }
wana_kana = "5.0.0"
wasm-bindgen = { version = "0.2.129", features = ["serde"] }
web-sys = { version = "0.3.106", features = [
    "Navigator",
    "Screen",
    "Window",
    "MediaQueryList",
] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
incremental = false
